    <!-- bezel facets -->
    <path d="M38 148 L90.46000000000001 95.53999999999999" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.4"/>
    <path d="M74.6 148 L90.46000000000001 95.53999999999999" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.4"/>
    <path d="M111.2 148 L135.661 95.53999999999999" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.4"/>
    <path d="M245.4 148 L229.54 95.53999999999999" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="1.4"/>
    <path d="M208.8 148 L184.339 95.53999999999999" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="1.4"/>
    <path d="M282 148 L229.54 95.53999999999999" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.4"/>
    <!-- girdle -->
