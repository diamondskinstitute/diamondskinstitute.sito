    <path d="M282 148 L135.6 223.64" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.2" fill="none"/>
    <!-- crown -->
    <path d="M38 148 L90.46000000000001 95.53999999999999 L229.54 95.53999999999999 L282 148 Z"
